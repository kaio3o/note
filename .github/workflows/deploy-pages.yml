# 將 Obsidian 筆記用 Quartz 5 建置成網站，並發布到 GitHub Pages。
# 筆記檔案維持原位：建置時才另外下載 Quartz，並直接讀取倉庫根目錄的筆記。
name: Deploy notes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Quartz 5 v5 分支的固定版本（外掛改由 npm 安裝，並修正子路徑網址問題）
  QUARTZ_VERSION: 97a2d05f80c4c50534959b1d0d41cc4b3895625e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          path: notes
          fetch-depth: 0 # 完整歷史，用來取得每篇筆記的最後修改日期

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: ${{ env.QUARTZ_VERSION }}
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install Quartz
        working-directory: quartz
        run: npm ci # Quartz 5 的外掛是 npm 套件，會一併安裝

      - name: Apply site config
        working-directory: quartz
        run: |
          cp ../notes/.github/quartz/quartz.config.yaml quartz.config.yaml
          cp ../notes/.github/quartz/custom.scss quartz/styles/custom.scss
          cp ../notes/.github/quartz/apply-hidden.mjs apply-hidden.mjs
          node apply-hidden.mjs ../notes/.obsidian/plugins/site-publish-control/data.json quartz.config.yaml

      - name: Generate homepage
        # 依 .github/quartz/home.md 的設定與公開的筆記產生首頁；只寫入 CI 的暫存工作區，不會提交回倉庫。
        # 若在倉庫根目錄自行新增 index.md，會改用那篇當首頁。
        working-directory: quartz
        run: |
          if [ ! -f ../notes/index.md ]; then
            cp ../notes/.github/quartz/build-home.mjs build-home.mjs
            node build-home.mjs ../notes quartz.config.yaml ../notes/.github/quartz/home.md ../notes/index.md
          fi

      - name: Build site
        working-directory: quartz
        run: npx quartz build -d ../notes -o ../public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
