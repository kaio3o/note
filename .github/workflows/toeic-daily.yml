name: Generate daily TOEIC vocabulary

on:
  schedule:
    # 避開整點高負載：00:17 UTC = 台灣時間 08:17。
    - cron: "17 0 * * *"
    # 補償執行：若第一輪被 GitHub 延遲或略過，01:17 UTC = 台灣時間 09:17。
    # 當日 JSON 已存在時，產生器會直接結束，不會重複建立檔案或 commit。
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date in YYYY-MM-DD format"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: toeic-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Markdown and JSON
        env:
          GENERATE_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$GENERATE_DATE" ]; then
            python scripts/generate_toeic_daily.py --date "$GENERATE_DATE"
          else
            python scripts/generate_toeic_daily.py
          fi

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "多益高頻單字" "scripts/generate_toeic_daily.py"
          if git diff --cached --quiet; then
            echo "No new TOEIC files to commit."
            exit 0
          fi
          commit_date=$(date -u +%F)
          git commit -m "chore(toeic): add daily vocabulary $commit_date"
          git push origin main
